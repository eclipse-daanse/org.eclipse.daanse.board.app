name: Model conformance check

concurrency:
  group: model-conformance-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  check:
    name: Model conformance
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # The check reads .ecore files and src/gen/*.ts only. No install, no
      # build - it has nothing to wait for, and must not pay the CI build's
      # sixty minutes to say what it can say in a second.
      - name: Check that the runtime uses the generated classes
        run: node scripts/check-model-conformance.mjs
