name: 'Electron'
on:
  workflow_run:
    workflows:
      - 'CI'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
jobs:
  release:
    # A red or cancelled CI run is no reason to publish an app.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    steps:
      # The commit CI tested, not whatever main points at by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        working-directory: .
        run: yarn --skip-integrity-check --no-lockfile --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all Modules
        working-directory: .
        run: yarn run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build
        working-directory: ./packages/app/electron
        run: yarn run copy_app_files

      - name: Publish Electron app
        working-directory: ./packages/app/electron
        run: yarn run publish@electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
