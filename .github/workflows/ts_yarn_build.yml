name: CI

# A newer push to a pull request makes the older run pointless. On main it
# does not: every commit there is meant to become an image, and cancelling
# left main without one whenever two merges came close together.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    # A release is a tag; it runs the whole pipeline and ends in a GitHub
    # Release (see the release job). The tag names the app it releases:
    # board-v1.2.0, workbench-v0.3.0. A plain v1.2.0 is the board, as
    # before there were two.
    tags:
      - 'v*'
      - 'board-v*'
      - 'workbench-v*'
  pull_request:
    branches:
      - 'main'

# Three jobs side by side, each on its own runner: the build that becomes
# the image, the type check and the tests. They used to run one after
# another in one job, the type check inside every package's build. The
# image waits for all three.
#
# A runner has 4 vCPUs. turbo runs 4 tasks at a time; at 20 they mostly
# waited for each other, and a test that measures time took 96 s instead
# of 5.
env:
  TURBO_ARGS: --concurrency=4 --cache-dir=.turbo/cache --summarize
  NODE_OPTIONS: --max_old_space_size=65536

jobs:
  build:
    name: Build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      version: ${{ steps.apps.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # Which apps this run builds (scripts/apps.mjs). A release tag builds
      # the one it names; everything else builds both, since the workbench
      # is a part of what the board build has made already.
      - name: Choose the apps
        id: apps
        run: |
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:workbench-v*) apps='["workbench"]'; version="${GITHUB_REF_NAME#workbench-v}" ;;
            tag:board-v*)     apps='["board"]';     version="${GITHUB_REF_NAME#board-v}" ;;
            tag:v*)           apps='["board"]';     version="${GITHUB_REF_NAME#v}" ;;
            *)                apps='["board","workbench"]'; version= ;;
          esac
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $apps${version:+, version $version}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install
        run: yarn --immutable --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      # turbo names each task's output by a hash of its inputs, so an
      # output kept from an earlier run is used only where nothing it was
      # made from has changed.
      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ hashFiles('yarn.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ hashFiles('yarn.lock', 'turbo.json') }}-
            turbo-build-

      - name: Build all Modules
        run: yarn turbo run build ${{ env.TURBO_ARGS }}

      - name: Keep only what this run used in the turbo cache
        run: scripts/ci/prune-turbo-cache.sh

      # `yarn build` does not build the tsm bundles, and build:prod only
      # copies what is there. Without this step the image held 4 of 154.
      # The workbench alone needs only its own; the board needs them all,
      # and with them the workbench's.
      - name: Build bundles
        run: yarn run bundles --force
        env:
          VITE_APP: ${{ steps.apps.outputs.apps == '["workbench"]' && 'workbench' || '' }}

      - name: Build the board
        if: contains(fromJSON(steps.apps.outputs.apps), 'board')
        working-directory: ./packages/app/default
        run: yarn run build:prod
        env:
          # A missing bundle fails the build instead of a warning in the log.
          REQUIRE_ALL_BUNDLES: '1'

      - name: Build the workbench
        if: contains(fromJSON(steps.apps.outputs.apps), 'workbench')
        working-directory: ./packages/app/default
        run: yarn run build:prod:workbench
        env:
          REQUIRE_ALL_BUNDLES: '1'

      - name: Keep the board build for its image
        if: github.event_name != 'pull_request' && contains(fromJSON(steps.apps.outputs.apps), 'board')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-dist-board
          path: ./packages/app/default/dist-board
          retention-days: 7
          if-no-files-found: error

      - name: Keep the workbench build for its image
        if: github.event_name != 'pull_request' && contains(fromJSON(steps.apps.outputs.apps), 'workbench')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-dist-workbench
          path: ./packages/app/default/dist-workbench
          retention-days: 7
          if-no-files-found: error

  # Every package's vue-tsc / tsc, as the turbo task `typecheck`. It needs
  # the declarations of the packages a package imports, so this job builds
  # them too - from the cache where it can.
  typecheck:
    name: Type check
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install
        run: yarn --immutable --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ hashFiles('yarn.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ hashFiles('yarn.lock', 'turbo.json') }}-
            turbo-typecheck-
            turbo-build-

      # These six had a typecheck script that no build ever ran, and fail
      # it (#1417). Each one taken off here is checked from then on.
      - name: Type check all Modules
        run: >
          yarn turbo run typecheck ${{ env.TURBO_ARGS }}
          --filter='!org.eclipse.daanse.board.app.lib.lsp.lang.dax'
          --filter='!org.eclipse.daanse.board.app.lib.lsp.lang.dmv'
          --filter='!org.eclipse.daanse.board.app.lib.lsp.lang.mdx'
          --filter='!org.eclipse.daanse.board.app.lib.lsp.lang.sql'
          --filter='!org.eclipse.daanse.board.app.lib.lsp.server'
          --filter='!org.eclipse.daanse.board.app.ui.vue.common.lsp'

      - name: Keep only what this run used in the turbo cache
        run: scripts/ci/prune-turbo-cache.sh

  # The tests run against the sources (vitest.config.ts), so they need no
  # build.
  test:
    name: Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install
        run: yarn --immutable --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      - name: Check translations
        run: node scripts/i18n.mjs check

      - name: Test
        run: yarn run test

  # The image is built from the dist of this very run, so its tag and its
  # content name the same commit, and a failed build yields no image. It
  # used to follow CI through workflow_run and a cache that fell back to
  # any earlier build.
  #
  # One image per app the build made, each under the app's name:
  # eclipsedaanse/board and eclipsedaanse/workbench, likewise in ghcr.io.
  image:
    name: Image (${{ matrix.app }})
    needs: [build, typecheck, test]
    if: github.event_name != 'pull_request' && startsWith(github.repository, 'eclipse-daanse/')
    runs-on: ubuntu-latest
    strategy:
      # The board does not wait for the workbench, nor the other way round.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.build.outputs.apps) }}
    permissions:
      contents: read
      packages: write
    # A matrix job has one set of outputs, the last leg's. A release tag
    # builds one app, so there the digest is that app's; the release job
    # reads it only then.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Fetch the browser build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-dist-${{ matrix.app }}
          path: ./packages/app/default/dist-${{ matrix.app }}

      - name: Update dockerhub repo description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: eclipsedaanse/${{ matrix.app }}
          readme-filepath: Docker/README.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3.2.1
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to Github Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What an image is called.
      #
      # A release (tag <app>-vX.Y.Z, or vX.Y.Z for the board) is X.Y.Z, and
      # `latest` unless it is a prerelease such as board-v1.2.0-rc.1, in
      # both registries; it stays.
      #
      # An image of main is `main`, which moves with every build, and
      # `sha-<commit>`, in ghcr.io only, for 30 days (image_retention.yml).
      # Docker Hub gets the moving tag alone, since nothing clears it out.
      # Started by hand on another branch, the image gets the sha tag
      # only: `main` names what main holds.
      - name: Name the image
        id: names
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo 'tags<<EOF'
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              version="$VERSION"
              for registry in "docker.io/eclipsedaanse/$APP" "ghcr.io/eclipse-daanse/$APP"; do
                echo "$registry:$version"
                case "$version" in
                  *-*) ;;
                  *) echo "$registry:latest" ;;
                esac
              done
            else
              echo "ghcr.io/eclipse-daanse/$APP:sha-${GITHUB_SHA::9}"
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                echo "ghcr.io/eclipse-daanse/$APP:main"
                echo "docker.io/eclipsedaanse/$APP:main"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The image is nginx and static files, so two platforms cover what
      # runs it; the other four only cost build time.
      #
      # sbom and provenance make BuildKit attach an SPDX SBOM and the build
      # provenance to the image in the registry, for every image. The
      # CycloneDX SBOMs of a release are made in the release job.
      - name: Build and Push Multi-Arch Docker Image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: "Docker/Dockerfile"
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: APP=${{ matrix.app }}
          tags: ${{ steps.names.outputs.tags }}

  # What a release ships, listed: one SBOM of the sources (every package in
  # yarn.lock) and one of the image (nginx's Alpine packages and the files
  # served), both CycloneDX 1.6, attached to the GitHub Release. The image
  # SBOM is also attested on the image in ghcr.io, so whoever pulls it can
  # verify what it holds with `gh attestation verify`.
  #
  # A release tag builds one app (see the build job), so this is its
  # release, and its image is the one image this run pushed.
  release:
    name: Release
    needs: [build, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/eclipse-daanse/${{ fromJSON(needs.build.outputs.apps)[0] }}
      DIGEST: ${{ needs.image.outputs.digest }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Read from yarn.lock and the workspace package.json files; nothing
      # is installed.
      - name: SBOM of the sources
        run: >
          npx --yes @cyclonedx/cdxgen@12.9.1
          --type js
          --spec-version 1.6
          --no-install-deps
          --project-name org.eclipse.daanse.board.app
          --project-version "$VERSION"
          --output sbom-source.cdx.json
          .

      - name: Login to Github Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest: the image this run pushed, not whatever the tag points
      # at by the time this step runs.
      - name: SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: cyclonedx-json@1.6
          output-file: sbom-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true

      # A release written by hand before the tag was pushed keeps its text
      # and gets the SBOMs added; otherwise one is made with GitHub's notes.
      - name: Attach the SBOMs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" sbom-source.cdx.json sbom-image.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" sbom-source.cdx.json sbom-image.cdx.json --verify-tag --generate-notes
          fi
